[package]
name = "rigscan-cli"
description = "Command line interface for Rigscan"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rigscan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rigscan-core = { path = "../rigscan-core" }
serde_json = "1.0.149"
