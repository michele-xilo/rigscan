[package]
name = "rigscan-cli"
description = "Command line interface for Rigscan"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rigscan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
rayon = "1.12.0"
rigscan-core = { path = "../rigscan-core" }
serde_json = "1.0.149"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "std"] }
