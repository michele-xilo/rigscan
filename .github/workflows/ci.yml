name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 space/test_rigscan_space.py
      - run: cargo build -p rigscan-core --target wasm32-unknown-unknown
      - run: cargo build -p rigscan-wasm --target wasm32-unknown-unknown --profile wasm
      - run: cargo bench --workspace --no-run
      - run: python3 scripts/compare/compare.py --check

  mujoco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install mujoco usd-core
      - run: scripts/fetch-corpus.sh
      - run: scripts/fetch-mjcf-corpus.sh
      - run: scripts/fetch-usd-corpus.sh
      - run: cargo build -p rigscan-cli
      - run: python3 scripts/verify/mujoco_load.py --require
      - run: python3 scripts/verify/mujoco_compare.py --require
      - run: python3 scripts/verify/usd_compare.py --require
      - run: python3 scripts/verify/usd_write_check.py --require
